name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  private-deployment-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private Compose profiles, ports, and API mode
        run: python infra/deploy/check_compose.py
      - name: Build private backend and web images without credentials
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: docker compose --env-file infra/deploy/.env.example -f infra/deploy/compose.yaml build api web
      - name: Smoke-test packaged backend commands and web bundle
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://reader@postgres:5432/market_eagle \
            -e AGENT_DATABASE_URL=postgresql://agent@postgres:5432/market_eagle \
            -e MARKET_EAGLE_SOURCE=alpaca -e MARKET_EAGLE_FEED=sip \
            -e MARKET_EAGLE_PRICE_BASIS=raw -e MARKET_EAGLE_EXCHANGE=US_EQUITY \
            -e MARKET_EAGLE_AGENT_ENABLED=1 -e MARKET_EAGLE_RUNTIME=production \
            market-eagle/backend:reviewed-commit \
            -c 'import market_eagle.app; import market_eagle.agent.worker'
          docker run --rm --entrypoint python market-eagle/backend:reviewed-commit -m market_eagle.ingestion.bootstrap --help
          docker run --rm --entrypoint python market-eagle/backend:reviewed-commit -m market_eagle.ingestion.alpaca_sample_cli --help
          docker run --rm --entrypoint sh market-eagle/web:reviewed-commit -c 'test -s /usr/share/nginx/html/index.html'

  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend checks when available
        if: hashFiles('backend/pyproject.toml') != ''
        run: python -m pip install -e './backend[dev]'
      - name: Check committed fixture, formatting, and unit tests
        run: python dev.py verify
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend build, calculations, and lint
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run test
          npm --prefix frontend run lint
      - name: Start local services, check databases and Temporal, run migrations and synthetic API tests
        run: python dev.py integration
      - name: Service logs after failure
        if: failure()
        run: docker compose --env-file infra/.env -f infra/compose.yaml logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: python dev.py down
