name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend checks when available
        if: hashFiles('backend/pyproject.toml') != ''
        run: python -m pip install -e './backend[dev]'
      - name: Check committed fixture, formatting, and unit tests
        run: python dev.py verify
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend build, calculations, and lint
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run test
          npm --prefix frontend run lint
      - name: Start local services, check databases and Temporal, run migrations and synthetic API tests
        run: python dev.py integration
      - name: Service logs after failure
        if: failure()
        run: docker compose --env-file infra/.env -f infra/compose.yaml logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: python dev.py down
