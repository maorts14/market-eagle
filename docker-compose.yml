name: market-eagle

services:
  object-store:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q running"]
      interval: 5s
      timeout: 3s
      retries: 20

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    # The upstream image runs non-root while a fresh named volume is root-owned.
    # This local-only service owns its catalog volume; production should use managed catalog credentials instead.
    user: "0:0"
    environment:
      # Keep catalog metadata durable; table files themselves live in object-store.
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:4566
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      object-store:
        condition: service_healthy
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog-data:/var/lib/iceberg

  trino:
    image: trinodb/trino:470
    depends_on:
      iceberg-rest:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino:ro

  market-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_eagle
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5432:5432"
    volumes:
      - market-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_eagle"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://market:market@market-db:5432/market_eagle
    depends_on:
      market-db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://market:market@market-db:5432/market_eagle
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: market-eagle
      MARKET_EAGLE_DATA_MODE: ${MARKET_EAGLE_DATA_MODE:-demo}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://object-store:4566
      TRINO_HOST: trino
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:5173}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      market-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      iceberg-rest:
        condition: service_started
      trino:
        condition: service_started

  worker:
    build: ./backend
    command: python -m app.worker
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://market:market@market-db:5432/market_eagle
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: market-eagle
      MARKET_EAGLE_DATA_MODE: ${MARKET_EAGLE_DATA_MODE:-demo}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://object-store:4566
      TRINO_HOST: trino
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:5173}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
    volumes:
      - ./backend:/app
    depends_on:
      market-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      iceberg-rest:
        condition: service_started
      trino:
        condition: service_started

  scheduler:
    build: ./backend
    command: python -m app.scheduler
    restart: on-failure
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: market-eagle
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app

  web:
    build: ./web
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  localstack-data:
  iceberg-catalog-data:
  market-db-data:
  temporal-db-data:
