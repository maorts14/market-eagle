name: market-eagle-private

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - type: bind
        source: ${NVME_DATA_DIR:?set NVME_DATA_DIR}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  temporal:
    image: temporalio/server:1.27.2@sha256:38370631dfad000d8024b83541a1d74771418d90c1e8a6a2d6e6995865b77043
    entrypoint: ["/bin/sh", "/etc/temporal/private-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal_service
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/private.yaml
    secrets:
      - temporal_db_password
    volumes:
      - ./temporal-entrypoint.sh:/etc/temporal/private-entrypoint.sh:ro
      - ./temporal-dynamic.yaml:/etc/temporal/config/dynamicconfig/private.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  api:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.backend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?set SOURCE_REVISION}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://market_eagle_reader@postgres:5432/market_eagle
      AGENT_DATABASE_URL: postgresql://market_eagle_agent@postgres:5432/market_eagle
      PGPASS_SECRET: market_reader_pgpass
      AGENT_PGPASS_SECRET: agent_store_pgpass
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: market-eagle-private
      MARKET_EAGLE_SOURCE: ${MARKET_EAGLE_SOURCE:?set reviewed source}
      MARKET_EAGLE_FEED: ${MARKET_EAGLE_FEED:?set reviewed feed}
      MARKET_EAGLE_PRICE_BASIS: ${MARKET_EAGLE_PRICE_BASIS:?set reviewed basis}
      MARKET_EAGLE_EXCHANGE: ${MARKET_EAGLE_EXCHANGE:?set reviewed exchange}
      MARKET_EAGLE_AGENT_ENABLED: "1"
    secrets:
      - market_reader_pgpass
      - agent_store_pgpass
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=15)"]
      interval: 10s
      timeout: 17s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to a reviewed release}
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
      args:
        VITE_AGENT_MODE: api
        VITE_EXPLORER_MODE: api
        SOURCE_REVISION: ${SOURCE_REVISION:?set SOURCE_REVISION}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  ingestion:
    profiles: [collection]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    command: ["python", "-m", "market_eagle.ingestion.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_ingest@postgres:5432/market_eagle
      PGPASS_SECRET: app_ingest_pgpass
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: market-eagle-private
      ALPACA_MIN_REQUEST_INTERVAL_SECONDS: ${ALPACA_MIN_REQUEST_INTERVAL_SECONDS:-1}
    secrets:
      - app_ingest_pgpass
      - alpaca_key_id
      - alpaca_secret_key
      - fmp_key
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  agent:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    command: ["python", "-m", "market_eagle.agent"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://market_eagle_reader@postgres:5432/market_eagle
      AGENT_DATABASE_URL: postgresql://market_eagle_agent@postgres:5432/market_eagle
      PGPASS_SECRET: market_reader_pgpass
      AGENT_PGPASS_SECRET: agent_store_pgpass
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: market-eagle-private
      MARKET_EAGLE_SOURCE: ${MARKET_EAGLE_SOURCE:?set reviewed source}
      MARKET_EAGLE_FEED: ${MARKET_EAGLE_FEED:?set reviewed feed}
      MARKET_EAGLE_PRICE_BASIS: ${MARKET_EAGLE_PRICE_BASIS:?set reviewed basis}
      MARKET_EAGLE_EXCHANGE: ${MARKET_EAGLE_EXCHANGE:?set reviewed exchange}
      OPENROUTER_MODEL: nvidia/nemotron-3-super-120b-a12b:free
    secrets:
      - market_reader_pgpass
      - agent_store_pgpass
      - openrouter_key
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  temporal-ui:
    profiles: [operator-ui]
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-18081}:8080"
    restart: unless-stopped
    logging: *bounded-logs
    networks: [private]

  migrate-app:
    profiles: [maintenance]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    command: ["python", "-m", "market_eagle.ingestion.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_migrator@postgres:5432/market_eagle
      PGPASS_SECRET: app_migrator_pgpass
    secrets:
      - app_migrator_pgpass
    restart: "no"
    networks: [private]

  bootstrap-db:
    profiles: [maintenance]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    command: ["python", "-m", "market_eagle.ingestion.bootstrap", "init"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
      - temporal_db_password
      - market_reader_pgpass
      - agent_store_pgpass
      - app_ingest_pgpass
      - app_migrator_pgpass
    restart: "no"
    networks: [private]

  bootstrap-grants:
    profiles: [maintenance]
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to a reviewed release}
    command: ["python", "-m", "market_eagle.ingestion.bootstrap", "grants"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_admin_password
    restart: "no"
    networks: [private]

  bootstrap-temporal:
    profiles: [maintenance]
    image: temporalio/admin-tools:1.27.2-tctl-1.18.2-cli-1.3.0@sha256:b5ae59dae6ea00c22fc2bdf04a2cfaf59e3e036b8b09ca777f99e2c871396fa2
    entrypoint: ["/bin/sh", "/scripts/bootstrap-temporal.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: temporal_service
    secrets:
      - temporal_db_password
    volumes:
      - ./bootstrap-temporal.sh:/scripts/bootstrap-temporal.sh:ro
    restart: "no"
    networks: [private]

  bootstrap-namespace:
    profiles: [maintenance]
    image: temporalio/admin-tools:1.27.2-tctl-1.18.2-cli-1.3.0@sha256:b5ae59dae6ea00c22fc2bdf04a2cfaf59e3e036b8b09ca777f99e2c871396fa2
    entrypoint: ["/bin/sh", "/scripts/bootstrap-namespace.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: market-eagle-private
    volumes:
      - ./bootstrap-namespace.sh:/scripts/bootstrap-namespace.sh:ro
    restart: "no"
    networks: [private]

  verify-pollers:
    profiles: [maintenance]
    image: temporalio/admin-tools:1.27.2-tctl-1.18.2-cli-1.3.0@sha256:b5ae59dae6ea00c22fc2bdf04a2cfaf59e3e036b8b09ca777f99e2c871396fa2
    entrypoint: ["/bin/sh", "/scripts/verify-pollers.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: market-eagle-private
      CHECK_COLLECTION: ${CHECK_COLLECTION:-0}
      POLLER_ATTEMPTS: ${POLLER_ATTEMPTS:-12}
    volumes:
      - ./verify-pollers.sh:/scripts/verify-pollers.sh:ro
    restart: "no"
    networks: [private]

secrets:
  postgres_admin_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/postgres_admin_password
  temporal_db_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/temporal_db_password
  market_reader_pgpass:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/market_reader.pgpass
  app_ingest_pgpass:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/app_ingest.pgpass
  agent_store_pgpass:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/agent_store.pgpass
  app_migrator_pgpass:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/app_migrator.pgpass
  alpaca_key_id:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/alpaca_key_id
  alpaca_secret_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/alpaca_secret_key
  fmp_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/fmp_key
  openrouter_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR}/openrouter_key

networks:
  private:
    driver: bridge
