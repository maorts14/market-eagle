name: market-eagle-dev

services:
  app-db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: ${APP_DB_USER:?set APP_DB_USER in infra/.env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in infra/.env}
      POSTGRES_DB: ${APP_DB_NAME:?set APP_DB_NAME in infra/.env}
    volumes:
      - app-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${APP_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER in infra/.env}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
      - ./temporal-init.sql:/docker-entrypoint-initdb.d/temporal-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: ${TEMPORAL_DB_USER:?set TEMPORAL_DB_USER in infra/.env}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in infra/.env}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  app-postgres:
  temporal-postgres:
