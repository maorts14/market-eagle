[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-eagle"
version = "0.1.0"
description = "Market Eagle research backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2.43,<3",
  "psycopg[binary]>=3.2,<4",
  "temporalio>=1.34,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.16,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["market_eagle*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["synthetic_integration: exercises local PostgreSQL and Temporal services"]
